# Config del OTel Collector para GCP. Misma imagen que otel-collector-config-aws.yaml,
# solo difiere en el exporter de logs (aquí: googlecloud) y en que las trazas SÍ van a
# Jaeger (según la actividad, Jaeger es específicamente para GCP; AWS usa X-Ray).
# El endpoint de Jaeger (JAEGER_OTLP_ENDPOINT) apunta DIRECTO a la IP pública de la
# tarea de Jaeger en AWS — ya no se enruta a través del Collector de AWS como antes.
# El orquestador (ECS/K8s) elige esta config vs. la de AWS pasando
# --config=<este archivo o el de aws> como command override —
# NO se controla con una variable de entorno dentro del YAML (eso causó un crash, ver apéndice del README).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  resource:
    attributes:
      - key: cloud.provider
        value: ${env:CLOUD_PROVIDER}
        action: upsert
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENV}
        action: upsert

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # Trazas -> Jaeger, que corre en su propia tarea de ECS en AWS (ver terraform/aws)
  otlp/jaeger:
    endpoint: ${env:JAEGER_OTLP_ENDPOINT}
    tls:
      insecure: ${env:JAEGER_TLS_INSECURE}

  # Métricas -> Prometheus vía remote write (push, evita scrape cross-cloud)
  prometheusremotewrite:
    endpoint: ${env:PROMETHEUS_REMOTE_WRITE_ENDPOINT}
    tls:
      insecure: ${env:PROMETHEUS_TLS_INSECURE}

  # Logs -> Cloud Logging
  googlecloud:
    project: ${env:GCP_PROJECT_ID}

  # Útil mientras depuras localmente
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/jaeger, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite, debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [googlecloud, debug]

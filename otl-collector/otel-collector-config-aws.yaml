# Config del OTel Collector para AWS. Trazas van a AWS X-Ray (no Jaeger — según la
# actividad, Jaeger es específicamente para GCP). Métricas van a un Prometheus
# centralizado que corre en su propia tarea de ECS (no comparte tarea con este
# Collector). El orquestador (ECS/K8s) elige esta config vs. la de GCP pasando
# --config=<este archivo o el de gcp> como command override — NO se controla con
# una variable de entorno dentro del YAML (eso causó un crash, ver apéndice del README).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  resource:
    attributes:
      - key: cloud.provider
        value: ${env:CLOUD_PROVIDER}
        action: upsert
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENV}
        action: upsert

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # Trazas -> AWS X-Ray (servicio nativo, no un contenedor que despliegues tú)
  awsxray:
    region: ${env:AWS_REGION}

  # Métricas -> Prometheus centralizado, en su propia tarea de ECS (ya no localhost)
  prometheusremotewrite:
    endpoint: ${env:PROMETHEUS_REMOTE_WRITE_ENDPOINT}
    tls:
      insecure: ${env:PROMETHEUS_TLS_INSECURE}

  # Logs -> CloudWatch
  awscloudwatchlogs:
    log_group_name: ${env:CLOUDWATCH_LOG_GROUP}
    log_stream_name: ${env:CLOUDWATCH_LOG_STREAM}
    region: ${env:AWS_REGION}

  # Útil mientras depuras localmente
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [awsxray, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite, debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [awscloudwatchlogs, debug]
